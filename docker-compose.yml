services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tron_wallet
    ports:
      - '5432:5432'
    volumes:
      - tron_wallet_db_data:/var/lib/postgresql/data

volumes:
  tron_wallet_db_data:
